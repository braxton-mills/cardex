# Campi timelapse service: every setting lives here.
# Paths may use {home}, {downloads} (real Downloads folder, OneDrive-aware) and {project}.
# After editing, run:  campi restart

[stream]
url = "http://campi.local:8000/stream.mjpg"
snapshot_url = "http://campi.local:8000/snapshot.jpg"   # high-quality JPEG per request (added to the Pi server)
pi_mac = "D8-3A-DD-A1-30-A1"       # Pi wlan0 MAC: if the host stops answering, capture finds the Pi on the LAN by this
timeout_s = 10               # connect timeout, and no data for this long = stream dropped
backoff_initial_s = 1
backoff_max_s = 60

[capture]
source = "snapshot"          # snapshot (q90 software JPEG from the Pi) | stream (hardware MJPEG, capped at 25 Mbps)
interval_s = 2.0             # seconds between saved frames
data_dir = "{home}\\CampiTimelapse"   # frames\, logs\, state\, work\ live here (outside Downloads)
expected_width = 0           # reject frames of any other size (0 = accept any; renders crop any size to 4:3)
expected_height = 0
stall_after_dupes = 5        # this many identical frames in a row = stalled stream -> reconnect

[render]
interval_min = 10            # render a clip every N minutes (wall-clock aligned)
window_min = 10              # each clip covers the last N minutes
delay_s = 15                 # wait after the window closes so the last frame is on disk
min_usable_frac = 0.5        # skip the clip if fewer usable frames than this fraction of expected
gap_factor = 3.0             # frames further apart than gap_factor * spacing = hard cut, no interpolation
timeout_min = 9              # kill a stuck render after this long

[output]
dir = "{home}\\OneDrive\\Videos\\campi"   # 10-min clips, latest.mp4, daily\ (synced by OneDrive)
width = 1440                 # must match the cropped aspect (4:3, or 3:4 when rotation is 90/270)
height = 1080
base_fps = 30                # source frames per second of video
interp_factor = 2            # RIFE multiplier (1 = off); final fps = base_fps * interp_factor
encoder = "auto"             # auto (NVENC, fall back to libx264) | nvenc | x264
cq = 19                      # NVENC constant quality (libx264 fallback uses crf = cq - 1)

[image]
rotation = 0                 # 0 / 90 / 180 / 270, clockwise
level_deg = 9.0              # extra counter-clockwise leveling; output is cropped so there are no black corners

[deflicker]
mode = "luma"                # luma (match each frame to a rolling average) | ffmpeg (deflicker filter) | off
window = 15                  # frames in the rolling average
min_gain = 0.8
max_gain = 1.25

[night]
luma_threshold = 35          # frames with mean brightness (0-255) below this are skipped

[overlay]
enabled = true
corner = "bottom-right"      # top-left | top-right | bottom-left | bottom-right
format = "%Y-%m-%d %H:%M:%S"
scale = 0.8                  # font size at 1080 px output height

[daily]
enabled = true
run_at = "00:05"             # render yesterday's full-day video at this time
target_seconds = 60
min_frames = 300             # skip the daily video if fewer usable frames than this

[archive]
enabled = true               # append every finished clip onto one long video in [archive] dir
max_gb = 2.0                 # start campi_archive_002.mp4 etc. when the next clip would pass this size
dir = "{downloads}\\campi-timelapse\\archive"   # kept off OneDrive: every append rewrites the current part (1-2 GB)

[retention]
clips_hours = 24             # 10-minute clips in Downloads (latest.mp4 and daily\ are never deleted)
raw_hours = 48               # keep every raw frame this long ...
thin_keep_per_minute = 1     # ... then keep this many frames per minute
thinned_retention_days = 0   # delete thinned frames after N days (0 = keep forever)
min_free_gb = 50             # below this, warn and delete the oldest thinned days first

[tools]
ffmpeg = "{localappdata}\\Microsoft\\WinGet\\Packages\\Gyan.FFmpeg_Microsoft.Winget.Source_8wekyb3d8bbwe\\ffmpeg-9.0.2-full_build\\bin\\ffmpeg.exe"   # full path or a name on PATH (falls back to PATH if missing)
ffprobe = "{localappdata}\\Microsoft\\WinGet\\Packages\\Gyan.FFmpeg_Microsoft.Winget.Source_8wekyb3d8bbwe\\ffmpeg-9.0.2-full_build\\bin\\ffprobe.exe"
rife = "{project}\\tools\\rife-ncnn-vulkan\\rife-ncnn-vulkan.exe"
rife_model = "rife-v4.6"     # folder next to the rife exe
rife_gpu = "NVIDIA"         # Vulkan device: name substring (preferred; index order differs with no one logged on) or index

[sightings]
# Optional vehicle "sightings": YOLO11m + ByteTrack on /stream.mjpg, SigLIP 2 make/model guess, one row per
# vehicle pass in CampiTimelapse\sightings\sightings.db. Needs `install.ps1 -Sightings` first.
enabled = true
detect_fps = 10              # stream frames per second fed to YOLO (the rest are dropped)
yolo_weights = "yolo11m.pt"  # bare name = CampiTimelapse\sightings\models\ (downloaded on first use)
yolo_imgsz = 1280            # larger input helps with far-away vehicles
clip_model = "ViT-SO400M-16-SigLIP2-384"
labels_file = "sightings_labels.txt"   # make/model list, one per line (relative = project folder)
min_crop_px = 64             # skip boxes narrower than this for make/model scoring
min_samples = 3              # need this many scored crops to record a vehicle
lost_after_s = 2.0           # a vehicle's pass ends once it has been out of view this long
unsure_below = 0.30          # top guess below this share is flagged unsure
stationary_px = 40           # box center moved less than this over the whole pass = stationary (logged once per spot)
roi = []                     # optional polygon, normalized 0-1, e.g. [[0,0.4],[1,0.4],[1,1],[0,1]]; only tracks whose center enters count
pause_at_night = true        # pause while the frame is darker than [night] luma_threshold (same check as renders)
save_clips = true
pre_roll_s = 2               # clip starts this long before the vehicle is first seen ...
post_roll_s = 3              # ... and ends this long after it was last seen (max 60 s)
keep_clips_days = 30         # crops, frames, and rows are kept forever
backend = "openvino"           # openvino (UHD 770, never the 5070) | cuda (YOLO11m + SigLIP 2 on the RTX card)
detect_model = "yolo26s"       # openvino backend: exported to sightings\models\ by `sightings-worker --check`
detect_imgsz = 640
detect_precision = "auto"      # fp16 | int8 | auto (int8 only if sightings-bench shows it keeps up and agrees)
ov_device = "GPU"              # OpenVINO device (Intel only; an NVIDIA device is never used); CPU fallback is automatic
classify_crops = 5             # best crops per vehicle kept during a pass and scored when it ends

[sightings.cloud]
# Gemini second opinion for unsure / close / first-ever labels. The row is written first and updated later.
enabled = true
model = "gemini-3.1-flash-lite"
api_key_file = "{home}\\CampiTimelapse\\secrets\\gemini.key"   # outside the repo; never logged
cloud_margin = 0.15            # also ask when top-1 minus top-2 share is below this
cloud_max_per_day = 400        # counted in the DB, resets at local midnight

[gaming]
# While a game uses the RTX card: renders wait (capture never pauses) and catch up in order afterwards.
auto = true                    # detect games automatically (`campi game on|off|auto` overrides)
game_dirs = [
  "C:\\Program Files (x86)\\Steam\\steamapps\\common",
  "D:\\SteamLibrary\\steamapps\\common",
  "C:\\Program Files\\Epic Games",
  "D:\\Epic Games",
  "D:\\EA Games",
  "D:\\Rockstar Games",
  "C:\\XboxGames",
  "C:\\Riot Games",
]
extra_exes = []
ignore_exes = ["wallpaper32.exe", "wallpaper64.exe", "Launcher.exe", "LauncherPatcher.exe", "RockstarService.exe",
               "SocialClubHelper.exe", "EADesktop.exe", "EABackgroundService.exe", "EpicGamesLauncher.exe",
               "EasyAntiCheat*.exe", "UnityCrashHandler*.exe", "CrashReportClient.exe"]
gpu_busy_pct = 20              # a matching process must use the 5070's 3D engine above this ...
gpu_busy_s = 30                # ... for this long before it counts as a game
defer_renders = true           # clip/daily renders wait while gaming (when rife_gpu is the NVIDIA card)
pause_sightings = false        # stop the sightings worker while gaming (it no longer uses the 5070)
