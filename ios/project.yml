name: Campi
options:
  bundleIdPrefix: com.braxtonmills
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  CampiKit:
    path: CampiKit

targets:
  Campi:
    type: application
    platform: iOS
    sources:
      - path: Campi
    dependencies:
      - package: CampiKit
    info:
      path: Campi/Info.plist
      properties:
        CFBundleDisplayName: Campi
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.braxtonmills.campi
            CFBundleURLSchemes: [campi]
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryAddUsageDescription: Campi saves timelapse clips, daily videos and sighting crops you choose to your photo library.
        NSLocalNetworkUsageDescription: Campi connects to a test server on your local network during development.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CampiAppGroup: group.com.braxtonmills.campi
        CampiKeychainGroup: $(AppIdentifierPrefix)com.braxtonmills.campi.shared
    entitlements:
      path: Campi/Campi.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.braxtonmills.campi
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.braxtonmills.campi.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.braxtonmills.campi
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: YES

  CampiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CampiUITests
    dependencies:
      - target: Campi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.braxtonmills.campi.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Campi:
    build:
      targets:
        Campi: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - package: CampiKit/CampiKitTests
        - CampiUITests
    archive:
      config: Release
